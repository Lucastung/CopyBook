# ══════════════════════════════════════════════════════════════════
#  書法字帖產生器 — 自動發布 CI/CD
#
#  觸發方式：推送 tag，例如 git tag v1.0.0 && git push origin v1.0.0
#  結果：自動在 GitHub Releases 建立頁面，附上 macOS .dmg 和 Windows .exe
# ══════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS build ─────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Pillow
        run: python3 -m pip install pillow 2>/dev/null || python3 -m pip install --break-system-packages pillow

      - name: Run dist.sh (macOS)
        run: bash release/dist.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/dist/*.dmg

  # ── Windows build ────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Pillow
        shell: pwsh
        run: pip install pillow

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Maven package
        shell: pwsh
        run: cd calligraphy-copybook; mvn package -DskipTests

      - name: Extract JavaFX native DLLs
        shell: pwsh
        run: |
          $m2  = "$env:USERPROFILE\.m2\repository\org\openjfx"
          $ver = "21.0.2"
          $staging = "release\staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "calligraphy-copybook\target\calligraphy-copybook-1.0-SNAPSHOT.jar" $staging
          $jar = "$m2\javafx-graphics\$ver\javafx-graphics-$ver-win.jar"
          if (-not (Test-Path $jar)) { Write-Error "找不到: $jar"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar)
          foreach ($entry in $zip.Entries) {
            if ($entry.Name -like "*.dll") {
              $dest = Join-Path $staging $entry.Name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
              Write-Host "extracted: $($entry.Name)"
            }
          }
          $zip.Dispose()

      - name: Generate icon.ico
        shell: python
        run: |
          from PIL import Image
          import os
          os.makedirs(r"release\icons", exist_ok=True)
          src = Image.open(r"calligraphy-copybook\src\main\resources\icon.png").convert('RGBA')
          src.save(r"release\icons\icon.ico", format='ICO',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("icon.ico generated")

      - name: jpackage EXE
        shell: pwsh
        run: |
          # 強制 PowerShell 使用 UTF-8（避免中文參數亂碼）
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8"

          New-Item -ItemType Directory -Force -Path "release\dist" | Out-Null

          # 找 jpackage 位置（優先用 JAVA_HOME，備援用 PATH）
          $jp = if ($env:JAVA_HOME) { Join-Path $env:JAVA_HOME "bin\jpackage.exe" } else { "jpackage" }
          Write-Host "jpackage: $jp"

          & $jp `
            --name           CalligraphyCopybook `
            --app-version    1.0.0 `
            --vendor         CalligraphyApp `
            --description    "Calligraphy Copybook Generator" `
            --input          release\staging `
            --main-jar       calligraphy-copybook-1.0-SNAPSHOT.jar `
            --main-class     com.calligraphy.App `
            --dest           release\dist `
            --icon           release\icons\icon.ico `
            --type           msi `
            --win-shortcut `
            --win-menu `
            --win-menu-group Calligraphy `
            --win-dir-chooser `
            --win-upgrade-uuid c4f8a1b2-d3e4-4f56-89ab-cd1234ef5678 `
            --java-options   "-Dfile.encoding=UTF-8"

          Write-Host "jpackage exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/dist/*.msi

  # ── 建立 GitHub Release ─────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    # macOS 成功就發布，Windows 失敗也不阻擋
    if: always() && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        # Windows build 失敗時此步驟會跳過，但不影響 Release 發布
        if: needs.build-windows.result == 'success'
        with:
          name: windows-exe
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "只是想寫寫字 ${{ github.ref_name }}"
          body: |
            ## 安裝說明
            - **macOS**：下載 `.dmg`，雙擊後拖拉 App 到 Applications
            - **Windows**：下載 `.exe`，雙擊後按指示完成安裝

            > 安裝包已內嵌 Java 執行環境，無需另外安裝 Java。
          files: artifacts/*
          draft: false
          prerelease: false
